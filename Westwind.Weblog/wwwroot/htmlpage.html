<ul>

    <li><a href="#0">Link with href and `#0`</a></li>
    <li><a href="javascript:void(0)">Link with JavaScript: tag</a></li>

<button>A real button</button>

    button.link {
        background: transparent;
        color: blue;
        border: none;

    }

        color: firebrick;

</style>
